services:
  batikhub-api:
    container_name: batikhub-api
    image: dhi.io/postgres:18-alpine3.23-dev 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: batikhub_api
    ports:
      - 5432:5432
    volumes:
      - type: volume
        source: batikhub-api-volume
        target: "/var/lib/postgresql/data"
        read_only: false


volumes:
  batikhub-api-volume:
    name: batikhub-api-volume