services:
  batikhub-api:
    container_name: batikhub-api
    image: postgres:latest 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: batikhub_api
    ports:
      - 5433:5432
    volumes:
      - type: volume
        source: batikhub-api-volume
        target: "/var/lib/postgresql"
        read_only: false


volumes:
  batikhub-api-volume:
    name: batikhub-api-volume